# ==========================================
# Docker Compose 生产环境配置
# ==========================================

version: '3.8'

services:
  # ==========================================
  # 前端服务
  # ==========================================
  frontend:
    image: ghcr.io/your-org/route-gen/frontend:${VERSION:-latest}
    container_name: route-gen-frontend
    restart: always
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - route-gen-network
    depends_on:
      - backend
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # ==========================================
  # 后端API服务
  # ==========================================
  backend:
    image: ghcr.io/your-org/route-gen/backend:${VERSION:-latest}
    container_name: route-gen-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALGORITHM_SERVICE_URL=http://algorithm:8000
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - LOG_LEVEL=info
    networks:
      - route-gen-network
    depends_on:
      - mysql
      - redis
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # ==========================================
  # 算法服务
  # ==========================================
  algorithm:
    image: ghcr.io/your-org/route-gen/algorithm:${VERSION:-latest}
    container_name: route-gen-algorithm
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=production
      - LOG_LEVEL=WARNING
      - MAX_WORKERS=8
      - CACHE_ENABLED=true
      - REDIS_URL=${REDIS_URL}
    networks:
      - route-gen-network
    depends_on:
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ==========================================
  # MySQL 数据库 (主)
  # ==========================================
  mysql-master:
    image: mysql:8.0
    container_name: route-gen-mysql-master
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=route_gen
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./database/mysql/master.cnf:/etc/mysql/conf.d/master.cnf
    networks:
      - route-gen-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ==========================================
  # MySQL 数据库 (从)
  # ==========================================
  mysql-slave:
    image: mysql:8.0
    container_name: route-gen-mysql-slave
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=route_gen
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./database/mysql/slave.cnf:/etc/mysql/conf.d/slave.cnf
    networks:
      - route-gen-network
    depends_on:
      - mysql-master
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ==========================================
  # Redis 主节点
  # ==========================================
  redis-master:
    image: redis:7-alpine
    container_name: route-gen-redis-master
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
      - ./database/redis/master.conf:/usr/local/etc/redis/redis.conf
    networks:
      - route-gen-network
    command: redis-server /usr/local/etc/redis/redis.conf

  # ==========================================
  # Redis 从节点
  # ==========================================
  redis-slave:
    image: redis:7-alpine
    container_name: route-gen-redis-slave
    restart: always
    volumes:
      - redis-slave-data:/data
    networks:
      - route-gen-network
    depends_on:
      - redis-master
    command: redis-server --slaveof redis-master 6379

  # ==========================================
  # MinIO 对象存储
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: route-gen-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - route-gen-network
    command: server /data --console-address ":9001"

  # ==========================================
  # Nginx 反向代理 / 负载均衡
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: route-gen-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx-cache:/var/cache/nginx
    networks:
      - route-gen-network
    depends_on:
      - frontend
      - backend

  # ==========================================
  # 任务队列 Worker
  # ==========================================
  worker:
    image: ghcr.io/your-org/route-gen/algorithm:${VERSION:-latest}
    container_name: route-gen-worker
    restart: always
    command: celery -A tasks worker --loglevel=warning --concurrency=8
    environment:
      - PYTHON_ENV=production
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - route-gen-network
    depends_on:
      - redis
      - mysql-master
    deploy:
      replicas: 2

  # ==========================================
  # 定时任务调度
  # ==========================================
  scheduler:
    image: ghcr.io/your-org/route-gen/algorithm:${VERSION:-latest}
    container_name: route-gen-scheduler
    restart: always
    command: celery -A tasks beat --loglevel=warning
    environment:
      - PYTHON_ENV=production
      - REDIS_URL=${REDIS_URL}
    volumes:
      - celery-beat-data:/var/lib/celery
    networks:
      - route-gen-network
    depends_on:
      - redis

  # ==========================================
  # 监控 - Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: route-gen-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - route-gen-network

  # ==========================================
  # 监控 - Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: route-gen-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - route-gen-network
    depends_on:
      - prometheus

  # ==========================================
  # 日志收集 - Fluentd
  # ==========================================
  fluentd:
    image: fluent/fluentd:v1.16-debian
    container_name: route-gen-fluentd
    restart: always
    volumes:
      - ./monitoring/fluentd/conf:/fluentd/etc
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - route-gen-network

  # ==========================================
  # 日志存储 - Elasticsearch
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: route-gen-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - route-gen-network

  # ==========================================
  # 日志可视化 - Kibana
  # ==========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: route-gen-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - route-gen-network
    depends_on:
      - elasticsearch

# ==========================================
# 数据卷
# ==========================================
volumes:
  mysql-master-data:
    driver: local
  mysql-slave-data:
    driver: local
  redis-master-data:
    driver: local
  redis-slave-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
  celery-beat-data:
    driver: local
  nginx-cache:
    driver: local

# ==========================================
# 网络
# ==========================================
networks:
  route-gen-network:
    driver: bridge
