# ==========================================
# Docker Compose 配置
# 本地开发环境
# ==========================================

version: '3.8'

services:
  # ==========================================
  # 前端服务
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000/api/v1
        - VITE_WS_URL=ws://localhost:3000/ws
        - VITE_APP_VERSION=1.0.0-dev
    container_name: route-gen-frontend
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=development
    networks:
      - route-gen-network
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================
  # 后端API服务
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: route-gen-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mysql://root:root@mysql:3306/route_gen
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=your-secret-key-change-in-production
      - ALGORITHM_SERVICE_URL=http://algorithm:8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=route-gen
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - route-gen-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # 算法服务
  # ==========================================
  algorithm:
    build:
      context: ./algorithm
      dockerfile: Dockerfile
    container_name: route-gen-algorithm
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
      - LOG_LEVEL=INFO
      - MAX_WORKERS=4
      - CACHE_ENABLED=true
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./algorithm:/app
    networks:
      - route-gen-network
    depends_on:
      - redis
    restart: unless-stopped

  # ==========================================
  # MySQL 数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: route-gen-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=route_gen
      - MYSQL_USER=route_gen
      - MYSQL_PASSWORD=route_gen_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - route-gen-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ==========================================
  # Redis 缓存
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: route-gen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - route-gen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # MinIO 对象存储
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: route-gen-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - route-gen-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ==========================================
  # Nginx 反向代理
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: route-gen-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - route-gen-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ==========================================
  # 任务队列 Worker (Celery)
  # ==========================================
  worker:
    build:
      context: ./algorithm
      dockerfile: Dockerfile
    container_name: route-gen-worker
    command: celery -A tasks worker --loglevel=info --concurrency=4
    environment:
      - PYTHON_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=mysql://root:root@mysql:3306/route_gen
    volumes:
      - ./algorithm:/app
    networks:
      - route-gen-network
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  # ==========================================
  # 定时任务调度 (Celery Beat)
  # ==========================================
  scheduler:
    build:
      context: ./algorithm
      dockerfile: Dockerfile
    container_name: route-gen-scheduler
    command: celery -A tasks beat --loglevel=info
    environment:
      - PYTHON_ENV=development
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./algorithm:/app
      - celery-beat-data:/var/lib/celery
    networks:
      - route-gen-network
    depends_on:
      - redis
    restart: unless-stopped

  # ==========================================
  # 监控 - Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: route-gen-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - route-gen-network
    restart: unless-stopped

  # ==========================================
  # 监控 - Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: route-gen-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - route-gen-network
    depends_on:
      - prometheus
    restart: unless-stopped

# ==========================================
# 数据卷
# ==========================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  celery-beat-data:
    driver: local

# ==========================================
# 网络
# ==========================================
networks:
  route-gen-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
